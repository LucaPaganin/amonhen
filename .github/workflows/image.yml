name: image

# The NAS pulls a built image, so it never needs this repository: the tag is
# what decides which code arrives, and the image is the only artifact that
# travels. Nothing here runs on the NAS.
on:
  push:
    tags: ["v*"]
  # A manual run publishes `latest` from the chosen branch, for a first deploy
  # or a rollback without inventing a tag.
  workflow_dispatch:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

env:
  # Lower case on purpose, and the same string as `image:` in
  # docker-compose.yaml: a registry reference with a capital letter is refused,
  # and the two have to name the same image or the NAS pulls nothing.
  IMAGE: ghcr.io/lucapaganin/amonhen

jobs:
  # An image is what reaches the NAS, so the code it carries is checked before
  # anything is published: publishing is the one step nobody can undo.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install the locked dependencies
        run: uv sync --frozen
      - name: Tests
        run: uv run pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: The bundle compiles
        run: |
          npm --prefix web ci --no-audit --no-fund
          npm --prefix web run build

  publish:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR with the token the run already has
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # The tag that was pushed, and `latest` for the newest image: a manual
          # run publishes `latest` alone, which is how a rollback arrives.
          tags: |
            type=ref,event=tag
            type=raw,value=latest
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # The NAS is x86_64: one platform is enough, and it builds natively
          # instead of through emulation.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
