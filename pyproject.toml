[project]
name = "amonhen"
version = "0.1.0"
description = "AmonHen — personal finance monitoring: unified PSD2 ledger, ingest and metrics"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "cryptography>=47.0.0",
    "fastapi>=0.115.0",
    "pyjwt[crypto]>=2.12.1",
    "requests>=2.33.1",
    "uvicorn[standard]>=0.32.0",
]

[project.scripts]
amonhen = "amonhen.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["amonhen"]

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "responses>=0.25.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
