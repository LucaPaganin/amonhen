services:
  amonhen:
    build:
      context: .
    container_name: amonhen
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    ports:
      # Reachable through Tailscale only; nothing is exposed publicly.
      - "${AMONHEN_BIND_ADDRESS:-127.0.0.1}:8000:8000"
    environment:
      AMONHEN_DB_PATH: /data/amonhen.db
      AMONHEN_CONFIG_FILE: /config/accounts.json
      AMONHEN_HOST: 0.0.0.0
      AMONHEN_PORT: "8000"
      # Documented tunables: without these entries the container never sees the
      # values the operator puts in .env.
      AMONHEN_SYNC_INTERVAL_HOURS: "${AMONHEN_SYNC_INTERVAL_HOURS:-6}"
      AMONHEN_EB_API: "${AMONHEN_EB_API:-https://api.enablebanking.com}"
      AMONHEN_UNCATEGORIZED: "${AMONHEN_UNCATEGORIZED:-Uncategorized}"
      AMONHEN_LLM_URL: "${AMONHEN_LLM_URL:-}"
      AMONHEN_LLM_API_KEY: "${AMONHEN_LLM_API_KEY:-}"
      AMONHEN_LLM_MODEL: "${AMONHEN_LLM_MODEL:-}"
    # Let .env decide the cadence instead of baking it into the image.
    command:
      - uv
      - run
      - --no-sync
      - python
      - -m
      - amonhen
      - serve
      - --sync-interval-hours
      - "${AMONHEN_SYNC_INTERVAL_HOURS:-6}"
    volumes:
      - amonhen-data:/data
      # Writable: /callback refreshes or adds a newly authorized account here.
      # pem_path in accounts.json is resolved relative to that file, so it finds
      # the key at /config/private.pem. Both files must exist before `up`.
      - ./accounts.json:/config/accounts.json
      - ./private.pem:/config/private.pem:ro

  # Optional, read-only-by-default MCP bridge to the existing Actual server.
  # Actual Budget is no longer a dependency of this app; the bridge stays for
  # direct use of the budget itself.
  actual-mcp:
    image: sstefanov/actual-mcp:1.11.3
    container_name: actual-mcp
    profiles: ["mcp"]
    restart: unless-stopped
    command: ["--sse", "--port", "3001", "--enable-bearer"]
    ports:
      - "127.0.0.1:3001:3001"
    extra_hosts:
      - "${ACTUAL_HOSTNAME:-actual.example.ts.net}:host-gateway"
    environment:
      ACTUAL_SERVER_URL: "${ACTUAL_URL:-}"
      ACTUAL_PASSWORD: "${ACTUAL_PASSWORD:-}"
      ACTUAL_BUDGET_ENCRYPTION_PASSWORD: "${ACTUAL_ENCRYPTION_PASSWORD:-}"
      ACTUAL_BUDGET_SYNC_ID: "${ACTUAL_BUDGET_SYNC_ID:-}"
      BEARER_TOKEN: "${ACTUAL_MCP_TOKEN:-}"

volumes:
  amonhen-data:
